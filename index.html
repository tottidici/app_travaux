<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi Travaux & Entretien</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .active-tab { color: #2563eb; border-top: 2px solid #2563eb; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-20 text-gray-800">

    <!-- En-tête -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-house-chimney-crack"></i> Mon Suivi Travaux
        </h1>
        <button id="syncBtn" onclick="syncWithKDrive()" class="text-xs bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded flex items-center gap-1 transition">
            <i class="fa-solid fa-rotate"></i> Sync kDrive
        </button>
    </header>

    <main class="max-w-md mx-auto p-4">
        <!-- Message d'alerte / Status -->
        <div id="statusAlert" class="hidden mb-4 p-3 rounded text-sm flex items-center justify-between"></div>

        <!-- ONGLET 1 : HISTORIQUE -->
        <section id="tab-history" class="space-y-4">
            <div class="flex gap-2">
                <select id="filterCategory" onchange="renderHistory()" class="w-full p-2 border rounded bg-white text-sm">
                    <option value="ALL">Toutes les catégories</option>
                    <option value="Maison">Maison</option>
                    <option value="Voiture">Voiture</option>
                </select>
                <select id="filterProperty" onchange="renderHistory()" class="w-full p-2 border rounded bg-white text-sm">
                    <option value="ALL">Tous les biens</option>
                </select>
            </div>
            <div id="historyList" class="space-y-3"></div>
        </section>

        <!-- ONGLET 2 : NOUVEAU / EDIT -->
        <section id="tab-add" class="hidden bg-white p-4 rounded-lg shadow space-y-4">
            <h2 class="text-lg font-bold border-b pb-2">Ajouter une intervention</h2>
            <form id="workForm" onsubmit="saveIntervention(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Catégorie</label>
                    <select id="category" required onchange="updatePropertyList()" class="w-full p-2 border rounded bg-white">
                        <option value="Maison">Maison</option>
                        <option value="Voiture">Voiture</option>
                    </select>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-semibold uppercase text-gray-600">Bien / Véhicule concerné</label>
                        <button type="button" onclick="switchTab('config')" class="text-xs text-blue-600 hover:underline">+ Gérer</button>
                    </div>
                    <select id="propertySelect" required class="w-full p-2 border rounded bg-white"></select>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Titre / Intitulé</label>
                    <input type="text" id="title" placeholder="Ex: Vidange, Remplacement chaudière" required class="w-full p-2 border rounded">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Date</label>
                        <input type="date" id="date" required class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Montant (€)</label>
                        <input type="number" step="0.01" id="amount" placeholder="0.00" class="w-full p-2 border rounded">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Artisan / Garage</label>
                    <input type="text" id="artisan" placeholder="Nom du prestataire" class="w-full p-2 border rounded">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Description / Notes</label>
                    <textarea id="notes" rows="3" class="w-full p-2 border rounded" placeholder="Détails, garanties, références pièces..."></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Photo / Facture (Scan)</label>
                    <input type="file" id="fileInput" accept="image/*,.pdf" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded font-bold hover:bg-blue-700 transition">Enregistrer</button>
            </form>
        </section>

        <!-- ONGLET 3 : STATS -->
        <section id="tab-stats" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-lg shadow space-y-2">
                <h3 class="text-gray-500 text-xs font-bold uppercase">Total Dépenses</h3>
                <p id="totalExpenses" class="text-3xl font-extrabold text-blue-600">0,00 €</p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow space-y-3">
                <h3 class="text-sm font-bold border-b pb-1">Répartition par bien</h3>
                <div id="statsByProperty" class="space-y-2 text-sm"></div>
            </div>
        </section>

        <!-- ONGLET 4 : CONFIG & kDRIVE -->
        <section id="tab-config" class="hidden space-y-4">
            <!-- Gestion des Biens -->
            <div class="bg-white p-4 rounded-lg shadow space-y-3">
                <h2 class="text-md font-bold border-b pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-building-user text-blue-600"></i> Mes Maisons & Véhicules
                </h2>
                <form onsubmit="addProperty(event)" class="flex gap-2">
                    <select id="newPropType" class="p-2 border rounded text-sm">
                        <option value="Maison">Maison</option>
                        <option value="Voiture">Voiture</option>
                    </select>
                    <input type="text" id="newPropName" placeholder="Nom (Ex: Clio 4, Chalet)" required class="w-full p-2 border rounded text-sm">
                    <button type="submit" class="bg-green-600 text-white px-3 py-2 rounded text-sm font-bold hover:bg-green-700">+</button>
                </form>
                <div id="propertiesList" class="space-y-2 pt-2"></div>
            </div>

            <!-- Paramètres WebDAV kDrive -->
            <div class="bg-white p-4 rounded-lg shadow space-y-3">
                <h2 class="text-md font-bold border-b pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-cloud text-blue-600"></i> Configuration kDrive WebDAV
                </h2>
                <form onsubmit="saveKDriveConfig(event)" class="space-y-3 text-sm">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">URL WebDAV</label>
                        <input type="url" id="webdavUrl" placeholder="https://kdrive-proxy.moncompte.workers.dev" required class="w-full p-2 border rounded">
                        <p class="text-xs text-gray-500 mt-1">Adresse de votre proxy Cloudflare Worker (sans « / » final). Un appel direct à kDrive est bloqué par le navigateur (CORS).</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Identifiant / Email Infomaniak</label>
                        <input type="email" id="webdavUser" placeholder="votre_email@exemple.com" required class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Mot de passe d'application</label>
                        <input type="password" id="webdavPassword" placeholder="••••••••••••••••" required class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Chemin du fichier sur kDrive</label>
                        <input type="text" id="webdavPath" value="/app_travaux/donnees_travaux.json" required class="w-full p-2 border rounded">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700">Enregistrer & Tester</button>
                    <p id="lastSync" class="text-xs text-gray-500 text-center"></p>
                </form>
            </div>
        </section>
    </main>

    <!-- Navigation du bas -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-2 text-xs text-gray-500 z-10">
        <button id="nav-history" onclick="switchTab('history')" class="flex flex-col items-center py-1 px-3 active-tab">
            <i class="fa-solid fa-list-check text-lg"></i>
            <span>Historique</span>
        </button>
        <button id="nav-add" onclick="switchTab('add')" class="flex flex-col items-center py-1 px-3">
            <i class="fa-solid fa-circle-plus text-lg"></i>
            <span>Saisir</span>
        </button>
        <button id="nav-stats" onclick="switchTab('stats')" class="flex flex-col items-center py-1 px-3">
            <i class="fa-solid fa-chart-pie text-lg"></i>
            <span>Stats</span>
        </button>
        <button id="nav-config" onclick="switchTab('config')" class="flex flex-col items-center py-1 px-3">
            <i class="fa-solid fa-gear text-lg"></i>
            <span>Biens & Config</span>
        </button>
    </nav>

    <script>
        // Data State
        let store = {
            properties: [
                { id: '1', name: 'Maison Principale', type: 'Maison' },
                { id: '2', name: 'Voiture Principale', type: 'Voiture' }
            ],
            interventions: [],
            kdrive: { url: '', user: '', password: '', path: '/app_travaux/donnees_travaux.json' },
            deletedIds: []   // ids supprimés (évite qu'ils réapparaissent après synchro)
        };

        // Échappe le HTML pour éviter toute injection via les champs saisis
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            loadLocalStore();
            document.getElementById('date').valueAsDate = new Date();
            updatePropertyList();
            renderProperties();
            renderHistory();
            renderStats();
            fillKDriveConfigForm();
            // Synchro automatique au démarrage si kDrive est configuré
            if (store.kdrive && store.kdrive.url && store.kdrive.user && store.kdrive.password) {
                syncWithKDrive(true);
            }
        });

        // Local Storage Handling
        function loadLocalStore() {
            const saved = localStorage.getItem('app_travaux_data');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    store = {
                        ...store, ...parsed,
                        properties: parsed.properties || store.properties,
                        interventions: parsed.interventions || [],
                        deletedIds: parsed.deletedIds || [],
                        kdrive: { ...store.kdrive, ...(parsed.kdrive || {}) }
                    };
                } catch (e) { console.error(e); }
            }
        }

        function saveLocalStore() {
            localStorage.setItem('app_travaux_data', JSON.stringify(store));
        }

        // Tab Switching
        function switchTab(tabName) {
            ['history', 'add', 'stats', 'config'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).classList.remove('active-tab');
            });
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`nav-${tabName}`).classList.add('active-tab');
            if (tabName === 'history') renderHistory();
            if (tabName === 'stats') renderStats();
        }

        // Properties Management
        function addProperty(e) {
            e.preventDefault();
            const name = document.getElementById('newPropName').value.trim();
            const type = document.getElementById('newPropType').value;
            if (!name) return;

            store.properties.push({ id: Date.now().toString(), name, type });
            saveLocalStore();
            syncWithKDrive(true);
            document.getElementById('newPropName').value = '';
            renderProperties();
            updatePropertyList();
            showAlert('Bien ajouté avec succès !', 'bg-green-100 text-green-800');
        }

        function deleteProperty(id) {
            if (!confirm('Supprimer ce bien ?')) return;
            store.properties = store.properties.filter(p => p.id !== id);
            store.deletedIds.push(id);
            saveLocalStore();
            renderProperties();
            updatePropertyList();
            syncWithKDrive(true);
        }

        function renderProperties() {
            const list = document.getElementById('propertiesList');
            list.innerHTML = store.properties.map(p => `
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded text-sm border">
                    <span><strong class="text-blue-600">[${esc(p.type)}]</strong> ${esc(p.name)}</span>
                    <button onclick="deleteProperty('${p.id}')" class="text-red-500 hover:text-red-700 px-2"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        function updatePropertyList() {
            const cat = document.getElementById('category').value;
            const select = document.getElementById('propertySelect');
            const filtered = store.properties.filter(p => p.type === cat);

            select.innerHTML = filtered.map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');
            if (filtered.length === 0) {
                select.innerHTML = `<option value="">-- Aucun bien disponible (Ajoutez-en) --</option>`;
            }

            // Update filter dropdown in History
            const filterProp = document.getElementById('filterProperty');
            filterProp.innerHTML = '<option value="ALL">Tous les biens</option>' + 
                store.properties.map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');
        }

        // Intervention Management
        function saveIntervention(e) {
            e.preventDefault();
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            const item = {
                id: Date.now().toString(),
                category: document.getElementById('category').value,
                property: document.getElementById('propertySelect').value,
                title: document.getElementById('title').value,
                date: document.getElementById('date').value,
                amount: parseFloat(document.getElementById('amount').value) || 0,
                artisan: document.getElementById('artisan').value,
                notes: document.getElementById('notes').value,
                attachmentName: file ? file.name : null
            };

            const finalizeSave = (attachmentBase64 = null) => {
                if (attachmentBase64) item.attachmentData = attachmentBase64;
                store.interventions.unshift(item);
                saveLocalStore();
                document.getElementById('workForm').reset();
                document.getElementById('date').valueAsDate = new Date();
                showAlert('Intervention enregistrée !', 'bg-green-100 text-green-800');
                switchTab('history');
                syncWithKDrive(); // Auto-sync
            };

            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => finalizeSave(event.target.result);
                reader.readAsDataURL(file);
            } else {
                finalizeSave();
            }
        }

        function renderHistory() {
            const catFilter = document.getElementById('filterCategory').value;
            const propFilter = document.getElementById('filterProperty').value;
            const container = document.getElementById('historyList');

            const filtered = store.interventions.filter(item => {
                const matchCat = catFilter === 'ALL' || item.category === catFilter;
                const matchProp = propFilter === 'ALL' || item.property === propFilter;
                return matchCat && matchProp;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500 py-8 text-sm">Aucune intervention enregistrée.</p>`;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="bg-white p-4 rounded-lg shadow space-y-2 border-l-4 ${item.category === 'Maison' ? 'border-blue-500' : 'border-green-500'}">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-xs font-bold px-2 py-0.5 rounded ${item.category === 'Maison' ? 'bg-blue-100 text-blue-800' : 'bg-green-100 text-green-800'}">${esc(item.property || item.category)}</span>
                            <h3 class="font-bold text-gray-800 text-md mt-1">${esc(item.title)}</h3>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="font-extrabold text-blue-600">${item.amount ? item.amount.toFixed(2) + ' €' : '-'}</span>
                            <button onclick="deleteIntervention('${esc(item.id)}')" title="Supprimer" class="text-red-400 hover:text-red-600"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="text-xs text-gray-500 flex justify-between">
                        <span><i class="fa-regular fa-calendar"></i> ${esc(item.date)}</span>
                        <span><i class="fa-solid fa-user-gear"></i> ${esc(item.artisan || 'N/C')}</span>
                    </div>
                    ${item.notes ? `<p class="text-xs text-gray-600 bg-gray-50 p-2 rounded">${esc(item.notes)}</p>` : ''}
                    ${item.attachmentData ? `
                        <div class="pt-1">
                            <a href="${item.attachmentData}" download="${esc(item.attachmentName || 'facture')}" class="text-xs text-blue-600 hover:underline flex items-center gap-1">
                                <i class="fa-solid fa-paperclip"></i> Voir la pièce jointe
                            </a>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function deleteIntervention(id) {
            if (!confirm('Supprimer cette intervention ?')) return;
            store.interventions = store.interventions.filter(i => i.id !== id);
            store.deletedIds.push(id);
            saveLocalStore();
            renderHistory();
            renderStats();
            syncWithKDrive(true);
        }

        // Stats Rendering
        function renderStats() {
            const total = store.interventions.reduce((sum, item) => sum + (item.amount || 0), 0);
            document.getElementById('totalExpenses').innerText = total.toFixed(2) + ' €';

            const byProp = {};
            store.interventions.forEach(item => {
                const key = item.property || item.category;
                byProp[key] = (byProp[key] || 0) + (item.amount || 0);
            });

            const container = document.getElementById('statsByProperty');
            container.innerHTML = Object.entries(byProp).map(([prop, amt]) => `
                <div class="flex justify-between items-center py-1 border-b">
                    <span>${esc(prop)}</span>
                    <span class="font-bold">${amt.toFixed(2)} €</span>
                </div>
            `).join('');
        }

        // kDrive WebDAV Integration
        function fillKDriveConfigForm() {
            if (store.kdrive) {
                document.getElementById('webdavUrl').value = store.kdrive.url || '';
                document.getElementById('webdavUser').value = store.kdrive.user || '';
                document.getElementById('webdavPassword').value = store.kdrive.password || '';
                document.getElementById('webdavPath').value = store.kdrive.path || '/app_travaux/donnees_travaux.json';
            }
        }

        function saveKDriveConfig(e) {
            e.preventDefault();
            store.kdrive = {
                url: document.getElementById('webdavUrl').value.trim().replace(/\/+$/, ''),
                user: document.getElementById('webdavUser').value.trim(),
                password: document.getElementById('webdavPassword').value.trim(),
                path: '/' + document.getElementById('webdavPath').value.trim().replace(/^\/+/, '')
            };
            saveLocalStore();
            fillKDriveConfigForm();
            syncWithKDrive();
        }

        // --- Outils WebDAV ---
        class HttpError extends Error {
            constructor(status) { super('HTTP ' + status); this.status = status; }
        }

        function describeError(err) {
            if (err instanceof HttpError) {
                switch (err.status) {
                    case 401: return 'Identifiants refusés (401). Vérifiez l\'e-mail et le mot de passe d\'application.';
                    case 403: return 'Accès interdit (403). Vérifiez l\'adresse d\'origine autorisée dans le proxy.';
                    case 404: return 'Chemin introuvable (404). Vérifiez l\'URL et le chemin du fichier.';
                    case 409: return 'Dossier parent introuvable (409). Vérifiez le chemin sur kDrive.';
                    case 507: return 'Espace insuffisant sur kDrive (507).';
                    default: return 'Le serveur a répondu avec l\'erreur ' + err.status + '.';
                }
            }
            if (err instanceof TypeError) {
                return 'Serveur injoignable ou requête bloquée (CORS). Vérifiez l\'URL du proxy Cloudflare Worker.';
            }
            return err.message || 'Erreur inconnue.';
        }

        function davUrl(config, path) {
            const encoded = path.split('/').map(encodeURIComponent).join('/');
            return config.url.replace(/\/+$/, '') + encoded;
        }

        // Crée les dossiers parents manquants (MKCOL), un par un
        async function ensureFolders(config, headers) {
            const parts = config.path.split('/').filter(Boolean);
            parts.pop(); // on retire le nom du fichier
            let current = '';
            for (const part of parts) {
                current += '/' + part;
                const res = await fetch(davUrl(config, current), { method: 'MKCOL', headers });
                // 201 = créé, 405 = existe déjà : les deux sont OK
                if (!res.ok && res.status !== 405) throw new HttpError(res.status);
            }
        }

        // Fusionne les données distantes dans les données locales
        function mergeRemote(remote) {
            const deleted = new Set([...(store.deletedIds || []), ...(remote.deletedIds || [])]);
            const mergeById = (local, distant) => {
                const map = new Map();
                (distant || []).forEach(x => map.set(x.id, x));
                (local || []).forEach(x => map.set(x.id, x)); // la version locale l'emporte
                return [...map.values()].filter(x => !deleted.has(x.id));
            };
            store.deletedIds = [...deleted];
            store.properties = mergeById(store.properties, remote.properties);
            store.interventions = mergeById(store.interventions, remote.interventions)
                .sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.id.localeCompare(a.id));
        }

        let syncing = false;
        function setSyncing(on) {
            syncing = on;
            const btn = document.getElementById('syncBtn');
            btn.disabled = on;
            btn.classList.toggle('opacity-60', on);
            btn.querySelector('i').classList.toggle('fa-spin', on);
        }

        // silent = true : n'affiche un message qu'en cas d'erreur
        async function syncWithKDrive(silent = false) {
            const config = store.kdrive;
            if (!config || !config.url || !config.user || !config.password) {
                if (silent !== true) showAlert('Veuillez configurer WebDAV kDrive dans l\'onglet Config.', 'bg-yellow-100 text-yellow-800');
                return;
            }
            if (syncing) return;
            setSyncing(true);
            if (silent !== true) showAlert('Synchronisation kDrive en cours...', 'bg-blue-100 text-blue-800');

            const path = '/' + (config.path || '/app_travaux/donnees_travaux.json').replace(/^\/+/, '');
            const fullUrl = davUrl(config, path);
            const auth = 'Basic ' + btoa(unescape(encodeURIComponent(config.user + ':' + config.password)));
            const headers = { 'Authorization': auth };

            try {
                // Étape 1 : lire le fichier distant (404 = pas encore créé, c'est normal)
                const getRes = await fetch(fullUrl, { method: 'GET', headers });
                if (getRes.ok) {
                    const text = (await getRes.text()).trim();
                    if (text) {
                        let remote;
                        try { remote = JSON.parse(text); }
                        catch { throw new Error('Le fichier distant n\'est pas un JSON valide.'); }
                        mergeRemote(remote);
                        saveLocalStore();
                    }
                } else if (getRes.status !== 404) {
                    throw new HttpError(getRes.status);
                }

                // Étape 2 : envoyer les données (SANS les identifiants kDrive)
                const payload = JSON.stringify({
                    version: 2,
                    updatedAt: new Date().toISOString(),
                    properties: store.properties,
                    interventions: store.interventions,
                    deletedIds: store.deletedIds
                }, null, 2);

                const put = () => fetch(fullUrl, {
                    method: 'PUT',
                    headers: { ...headers, 'Content-Type': 'application/json' },
                    body: payload
                });

                let putRes = await put();
                if (putRes.status === 404 || putRes.status === 409) {
                    await ensureFolders({ ...config, path }, headers);
                    putRes = await put();
                }
                if (!putRes.ok) throw new HttpError(putRes.status);

                renderHistory();
                renderStats();
                renderProperties();
                updatePropertyList();
                const now = new Date().toLocaleString('fr-FR');
                document.getElementById('lastSync').textContent = 'Dernière synchro réussie : ' + now;
                if (silent !== true) showAlert('Synchronisation kDrive réussie !', 'bg-green-100 text-green-800');
            } catch (err) {
                console.error(err);
                showAlert('Erreur kDrive : ' + esc(describeError(err)), 'bg-red-100 text-red-800');
            } finally {
                setSyncing(false);
            }
        }

        function showAlert(msg, bgClass) {
            const el = document.getElementById('statusAlert');
            el.className = `mb-4 p-3 rounded text-sm flex items-center justify-between ${bgClass}`;
            el.innerHTML = `<span>${msg}</span><button onclick="this.parentElement.classList.add('hidden')">&times;</button>`;
            el.classList.remove('hidden');
        }
    </script>
</body>
</html>
