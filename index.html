<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi Travaux & Entretien</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .active-tab { color: #2563eb; border-top: 2px solid #2563eb; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-20 text-gray-800">

    <!-- En-tête -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-house-chimney-crack"></i> Mon Suivi Travaux
        </h1>
        <button id="syncBtn" onclick="syncWithKDrive()" class="text-xs bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded flex items-center gap-1 transition">
            <i class="fa-solid fa-rotate"></i> Synchroniser
        </button>
    </header>

    <main class="max-w-md mx-auto p-4">
        <!-- Message d'alerte / Status -->
        <div id="statusAlert" class="hidden mb-4 p-3 rounded text-sm flex items-center justify-between"></div>

        <!-- ONGLET 1 : HISTORIQUE -->
        <section id="tab-history" class="space-y-4">
            <div class="flex gap-2">
                <select id="filterCategory" onchange="renderHistory()" class="w-full p-2 border rounded bg-white text-sm">
                    <option value="ALL">Toutes les catégories</option>
                    <option value="Maison">Maison</option>
                    <option value="Voiture">Voiture</option>
                </select>
                <select id="filterProperty" onchange="renderHistory()" class="w-full p-2 border rounded bg-white text-sm">
                    <option value="ALL">Tous les biens</option>
                </select>
            </div>
            <div id="historyList" class="space-y-3"></div>
        </section>

        <!-- ONGLET 2 : NOUVEAU / EDIT -->
        <section id="tab-add" class="hidden bg-white p-4 rounded-lg shadow space-y-4">
            <h2 class="text-lg font-bold border-b pb-2">Ajouter une intervention</h2>
            <form id="workForm" onsubmit="saveIntervention(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Catégorie</label>
                    <select id="category" required onchange="updatePropertyList()" class="w-full p-2 border rounded bg-white">
                        <option value="Maison">Maison</option>
                        <option value="Voiture">Voiture</option>
                    </select>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-semibold uppercase text-gray-600">Bien / Véhicule concerné</label>
                        <button type="button" onclick="switchTab('config')" class="text-xs text-blue-600 hover:underline">+ Gérer</button>
                    </div>
                    <select id="propertySelect" required class="w-full p-2 border rounded bg-white"></select>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Titre / Intitulé</label>
                    <input type="text" id="title" placeholder="Ex: Vidange, Remplacement chaudière" required class="w-full p-2 border rounded">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Date</label>
                        <input type="date" id="date" required class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Montant (€)</label>
                        <input type="number" step="0.01" id="amount" placeholder="0.00" class="w-full p-2 border rounded">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Artisan / Garage</label>
                    <input type="text" id="artisan" placeholder="Nom du prestataire" class="w-full p-2 border rounded">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Description / Notes</label>
                    <textarea id="notes" rows="3" class="w-full p-2 border rounded" placeholder="Détails, garanties, références pièces..."></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Photos / Factures (plusieurs possibles)</label>
                    <input type="file" id="fileInput" accept="image/*,.pdf" multiple class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>

                <p class="text-xs text-gray-500 -mt-2">Les photos sont réduites automatiquement (environ 300 Ko chacune). Les PDF sont limités à 8 Mo.</p>

                <button id="saveBtn" type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded font-bold hover:bg-blue-700 transition">Enregistrer</button>
            </form>
        </section>

        <!-- ONGLET 3 : STATS -->
        <section id="tab-stats" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-lg shadow space-y-2">
                <h3 class="text-gray-500 text-xs font-bold uppercase">Total Dépenses</h3>
                <p id="totalExpenses" class="text-3xl font-extrabold text-blue-600">0,00 €</p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow space-y-3">
                <h3 class="text-sm font-bold border-b pb-1">Répartition par bien</h3>
                <div id="statsByProperty" class="space-y-2 text-sm"></div>
            </div>
        </section>

        <!-- ONGLET 4 : CONFIG & kDRIVE -->
        <section id="tab-config" class="hidden space-y-4">
            <!-- Gestion des Biens -->
            <div class="bg-white p-4 rounded-lg shadow space-y-3">
                <h2 class="text-md font-bold border-b pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-building-user text-blue-600"></i> Mes Maisons & Véhicules
                </h2>
                <form onsubmit="addProperty(event)" class="flex gap-2">
                    <select id="newPropType" class="p-2 border rounded text-sm">
                        <option value="Maison">Maison</option>
                        <option value="Voiture">Voiture</option>
                    </select>
                    <input type="text" id="newPropName" placeholder="Nom (Ex: Clio 4, Chalet)" required class="w-full p-2 border rounded text-sm">
                    <button type="submit" class="bg-green-600 text-white px-3 py-2 rounded text-sm font-bold hover:bg-green-700">+</button>
                </form>
                <div id="propertiesList" class="space-y-2 pt-2"></div>
            </div>

            <!-- Paramètres de synchronisation (Cloudflare) -->
            <div class="bg-white p-4 rounded-lg shadow space-y-3">
                <h2 class="text-md font-bold border-b pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-cloud text-blue-600"></i> Synchronisation cloud
                </h2>
                <form onsubmit="saveSyncConfig(event)" class="space-y-3 text-sm">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Adresse du Worker Cloudflare</label>
                        <input type="url" id="syncUrl" placeholder="https://kdrive-proxy.moncompte.workers.dev" required class="w-full p-2 border rounded">
                        <p class="text-xs text-gray-500 mt-1">Sans « / » à la fin.</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Clé secrète</label>
                        <input type="password" id="syncToken" placeholder="La clé définie dans le Worker (TOKEN)" required class="w-full p-2 border rounded">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700">Enregistrer & Tester</button>
                    <p id="lastSync" class="text-xs text-gray-500 text-center"></p>
                </form>
            </div>
        </section>
    </main>

    <!-- Navigation du bas -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-2 text-xs text-gray-500 z-10">
        <button id="nav-history" onclick="switchTab('history')" class="flex flex-col items-center py-1 px-3 active-tab">
            <i class="fa-solid fa-list-check text-lg"></i>
            <span>Historique</span>
        </button>
        <button id="nav-add" onclick="switchTab('add')" class="flex flex-col items-center py-1 px-3">
            <i class="fa-solid fa-circle-plus text-lg"></i>
            <span>Saisir</span>
        </button>
        <button id="nav-stats" onclick="switchTab('stats')" class="flex flex-col items-center py-1 px-3">
            <i class="fa-solid fa-chart-pie text-lg"></i>
            <span>Stats</span>
        </button>
        <button id="nav-config" onclick="switchTab('config')" class="flex flex-col items-center py-1 px-3">
            <i class="fa-solid fa-gear text-lg"></i>
            <span>Biens & Config</span>
        </button>
    </nav>

    <script>
        // Data State
        let store = {
            properties: [
                { id: '1', name: 'Maison Principale', type: 'Maison' },
                { id: '2', name: 'Voiture Principale', type: 'Voiture' }
            ],
            interventions: [],
            kdrive: { url: '', token: '' },
            deletedIds: [],          // ids supprimés (évite qu'ils réapparaissent après synchro)
            pendingPhotoDeletes: []  // photos à supprimer du cloud à la prochaine synchro (local uniquement)
        };

        // Échappe le HTML pour éviter toute injection via les champs saisis
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        // Init
        document.addEventListener('DOMContentLoaded', async () => {
            loadLocalStore();
            document.getElementById('date').valueAsDate = new Date();
            updatePropertyList();
            renderProperties();
            renderHistory();
            renderStats();
            fillKDriveConfigForm();
            try { await migrateInlineAttachments(); } catch (e) { console.error('Migration pièces jointes', e); }
            // Synchro automatique au démarrage si la synchro est configurée
            if (store.kdrive && store.kdrive.url && store.kdrive.token) {
                syncWithKDrive(true);
            }
        });

        // Local Storage Handling
        function loadLocalStore() {
            const saved = localStorage.getItem('app_travaux_data');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    store = {
                        ...store, ...parsed,
                        properties: parsed.properties || store.properties,
                        interventions: parsed.interventions || [],
                        deletedIds: parsed.deletedIds || [],
                        pendingPhotoDeletes: parsed.pendingPhotoDeletes || [],
                        kdrive: { url: (parsed.kdrive && parsed.kdrive.url) || '', token: (parsed.kdrive && parsed.kdrive.token) || '' }
                    };
                } catch (e) { console.error(e); }
            }
        }

        function saveLocalStore() {
            localStorage.setItem('app_travaux_data', JSON.stringify(store));
        }

        // Tab Switching
        function switchTab(tabName) {
            ['history', 'add', 'stats', 'config'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).classList.remove('active-tab');
            });
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`nav-${tabName}`).classList.add('active-tab');
            if (tabName === 'history') renderHistory();
            if (tabName === 'stats') renderStats();
        }

        // Properties Management
        function addProperty(e) {
            e.preventDefault();
            const name = document.getElementById('newPropName').value.trim();
            const type = document.getElementById('newPropType').value;
            if (!name) return;

            store.properties.push({ id: Date.now().toString(), name, type });
            saveLocalStore();
            syncWithKDrive(true);
            document.getElementById('newPropName').value = '';
            renderProperties();
            updatePropertyList();
            showAlert('Bien ajouté avec succès !', 'bg-green-100 text-green-800');
        }

        function deleteProperty(id) {
            if (!confirm('Supprimer ce bien ?')) return;
            store.properties = store.properties.filter(p => p.id !== id);
            store.deletedIds.push(id);
            saveLocalStore();
            renderProperties();
            updatePropertyList();
            syncWithKDrive(true);
        }

        function renderProperties() {
            const list = document.getElementById('propertiesList');
            list.innerHTML = store.properties.map(p => `
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded text-sm border">
                    <span><strong class="text-blue-600">[${esc(p.type)}]</strong> ${esc(p.name)}</span>
                    <button onclick="deleteProperty('${p.id}')" class="text-red-500 hover:text-red-700 px-2"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        function updatePropertyList() {
            const cat = document.getElementById('category').value;
            const select = document.getElementById('propertySelect');
            const filtered = store.properties.filter(p => p.type === cat);

            select.innerHTML = filtered.map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');
            if (filtered.length === 0) {
                select.innerHTML = `<option value="">-- Aucun bien disponible (Ajoutez-en) --</option>`;
            }

            // Update filter dropdown in History
            const filterProp = document.getElementById('filterProperty');
            filterProp.innerHTML = '<option value="ALL">Tous les biens</option>' + 
                store.properties.map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');
        }

        // Intervention Management
        async function saveIntervention(e) {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            const files = [...document.getElementById('fileInput').files];

            btn.disabled = true;
            btn.textContent = files.length ? 'Préparation des photos...' : 'Enregistrement...';

            try {
                const attachments = [];
                for (const file of files) {
                    const att = await prepareAttachment(file);   // compresse + range dans IndexedDB
                    attachments.push({ id: att.id, name: att.name, type: att.type });
                }

                store.interventions.unshift({
                    id: Date.now().toString(),
                    category: document.getElementById('category').value,
                    property: document.getElementById('propertySelect').value,
                    title: document.getElementById('title').value,
                    date: document.getElementById('date').value,
                    amount: parseFloat(document.getElementById('amount').value) || 0,
                    artisan: document.getElementById('artisan').value,
                    notes: document.getElementById('notes').value,
                    attachments
                });
                saveLocalStore();
                document.getElementById('workForm').reset();
                document.getElementById('date').valueAsDate = new Date();
                showAlert('Intervention enregistrée !', 'bg-green-100 text-green-800');
                switchTab('history');
                syncWithKDrive(true);
            } catch (err) {
                console.error(err);
                showAlert('Enregistrement impossible : ' + esc(err.message || err), 'bg-red-100 text-red-800');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Enregistrer';
            }
        }

        function renderHistory() {
            const catFilter = document.getElementById('filterCategory').value;
            const propFilter = document.getElementById('filterProperty').value;
            const container = document.getElementById('historyList');

            const filtered = store.interventions.filter(item => {
                const matchCat = catFilter === 'ALL' || item.category === catFilter;
                const matchProp = propFilter === 'ALL' || item.property === propFilter;
                return matchCat && matchProp;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500 py-8 text-sm">Aucune intervention enregistrée.</p>`;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="bg-white p-4 rounded-lg shadow space-y-2 border-l-4 ${item.category === 'Maison' ? 'border-blue-500' : 'border-green-500'}">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-xs font-bold px-2 py-0.5 rounded ${item.category === 'Maison' ? 'bg-blue-100 text-blue-800' : 'bg-green-100 text-green-800'}">${esc(item.property || item.category)}</span>
                            <h3 class="font-bold text-gray-800 text-md mt-1">${esc(item.title)}</h3>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="font-extrabold text-blue-600">${item.amount ? item.amount.toFixed(2) + ' €' : '-'}</span>
                            <button onclick="deleteIntervention('${esc(item.id)}')" title="Supprimer" class="text-red-400 hover:text-red-600"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="text-xs text-gray-500 flex justify-between">
                        <span><i class="fa-regular fa-calendar"></i> ${esc(item.date)}</span>
                        <span><i class="fa-solid fa-user-gear"></i> ${esc(item.artisan || 'N/C')}</span>
                    </div>
                    ${item.notes ? `<p class="text-xs text-gray-600 bg-gray-50 p-2 rounded">${esc(item.notes)}</p>` : ''}
${(item.attachments && item.attachments.length) ? `
                        <div class="pt-1 flex flex-wrap gap-2">
                            ${item.attachments.map(att => (att.type || '').startsWith('image/') ? `
                                <a data-photo-link="${esc(att.id)}" target="_blank" rel="noopener" class="block">
                                    <img data-photo="${esc(att.id)}" alt="${esc(att.name)}" class="h-20 w-20 object-cover rounded border bg-gray-100">
                                </a>` : `
                                <a data-photo-link="${esc(att.id)}" target="_blank" rel="noopener" download="${esc(att.name)}" class="text-xs text-blue-600 hover:underline flex items-center gap-1 border rounded px-2 py-1">
                                    <i class="fa-solid fa-file-pdf"></i> ${esc(att.name)}
                                </a>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');
            hydratePhotos(container);
        }

        function deleteIntervention(id) {
            if (!confirm('Supprimer cette intervention ?')) return;
            const item = store.interventions.find(i => i.id === id);
            ((item && item.attachments) || []).forEach(att => {
                photoDelete(att.id).catch(console.error);
                store.pendingPhotoDeletes.push(att.id);
            });
            store.interventions = store.interventions.filter(i => i.id !== id);
            store.deletedIds.push(id);
            saveLocalStore();
            renderHistory();
            renderStats();
            syncWithKDrive(true);
        }

        // Stats Rendering
        function renderStats() {
            const total = store.interventions.reduce((sum, item) => sum + (item.amount || 0), 0);
            document.getElementById('totalExpenses').innerText = total.toFixed(2) + ' €';

            const byProp = {};
            store.interventions.forEach(item => {
                const key = item.property || item.category;
                byProp[key] = (byProp[key] || 0) + (item.amount || 0);
            });

            const container = document.getElementById('statsByProperty');
            container.innerHTML = Object.entries(byProp).map(([prop, amt]) => `
                <div class="flex justify-between items-center py-1 border-b">
                    <span>${esc(prop)}</span>
                    <span class="font-bold">${amt.toFixed(2)} €</span>
                </div>
            `).join('');
        }

        // =====================================================
        // Photos : IndexedDB (stockage local) + compression
        // =====================================================
        let dbPromise = null;
        function openDb() {
            if (!dbPromise) {
                dbPromise = new Promise((resolve, reject) => {
                    const req = indexedDB.open('app_travaux_photos', 1);
                    req.onupgradeneeded = () => req.result.createObjectStore('photos', { keyPath: 'id' });
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            }
            return dbPromise;
        }
        async function idb(mode, fn) {
            const db = await openDb();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('photos', mode);
                const req = fn(tx.objectStore('photos'));
                tx.oncomplete = () => resolve(req ? req.result : undefined);
                tx.onerror = () => reject(tx.error);
                tx.onabort = () => reject(tx.error || new Error('Stockage local plein ou refusé'));
            });
        }
        const photoPut = rec => idb('readwrite', st => st.put(rec));
        const photoGet = id => idb('readonly', st => st.get(id));
        const photoDelete = id => idb('readwrite', st => st.delete(id));

        const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

        async function compressImage(file, maxSide = 1600, quality = 0.8) {
            let bitmap;
            try {
                bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
            } catch (e) {
                bitmap = await new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = () => reject(new Error('Format d\'image non pris en charge : ' + file.name));
                    img.src = URL.createObjectURL(file);
                });
            }
            const w = bitmap.naturalWidth || bitmap.width, h = bitmap.naturalHeight || bitmap.height;
            const scale = Math.min(1, maxSide / Math.max(w, h));
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(w * scale);
            canvas.height = Math.round(h * scale);
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
            if (bitmap.close) bitmap.close();
            return new Promise((resolve, reject) => {
                canvas.toBlob(b => b ? resolve(b) : reject(new Error('Compression impossible')), 'image/jpeg', quality);
            });
        }

        // Prépare un fichier choisi : compresse les images, refuse les PDF trop gros, enregistre en local
        async function prepareAttachment(file) {
            let blob, name = file.name, type = file.type;
            if ((type || '').startsWith('image/')) {
                blob = await compressImage(file);
                type = 'image/jpeg';
                name = name.replace(/\.[^.]+$/, '') + '.jpg';
            } else if (type === 'application/pdf' || /\.pdf$/i.test(name)) {
                if (file.size > 8 * 1024 * 1024) throw new Error('PDF trop volumineux (8 Mo maximum) : ' + file.name);
                blob = file;
                type = 'application/pdf';
            } else {
                throw new Error('Type de fichier non pris en charge : ' + file.name);
            }
            const rec = { id: newId(), name, type, blob, synced: false };
            await photoPut(rec);
            return rec;
        }

        // Anciennes versions : pièces jointes stockées en base64 dans le JSON -> on les convertit
        async function migrateInlineAttachments() {
            let changed = false;
            for (const item of store.interventions) {
                if (!item.attachmentData) continue;
                try {
                    const raw = await (await fetch(item.attachmentData)).blob();
                    const file = new File([raw], item.attachmentName || 'piece', { type: raw.type });
                    const att = await prepareAttachment(file);
                    item.attachments = [...(item.attachments || []), { id: att.id, name: att.name, type: att.type }];
                } catch (e) { console.error('Migration impossible pour', item.id, e); continue; }
                delete item.attachmentData;
                delete item.attachmentName;
                changed = true;
            }
            if (changed) { saveLocalStore(); renderHistory(); }
        }

        // Affiche les photos de l'historique (lues depuis IndexedDB)
        const photoUrlCache = new Map();
        async function photoUrl(id) {
            if (photoUrlCache.has(id)) return photoUrlCache.get(id);
            const rec = await photoGet(id);
            if (!rec) return null;
            const url = URL.createObjectURL(rec.blob);
            photoUrlCache.set(id, url);
            return url;
        }
        async function hydratePhotos(container) {
            for (const a of container.querySelectorAll('[data-photo-link]')) {
                const id = a.dataset.photoLink;
                try {
                    const url = await photoUrl(id);
                    const img = a.querySelector('img[data-photo]');
                    if (url) {
                        a.href = url;
                        if (img) img.src = url;
                    } else if (img) {
                        img.alt = 'Photo non téléchargée : synchronisez';
                        img.title = 'Photo non téléchargée : synchronisez';
                    }
                } catch (e) { console.error(e); }
            }
        }

        // =====================================================
        // Synchronisation cloud (Cloudflare Worker + KV)
        // =====================================================
        function fillKDriveConfigForm() {
            document.getElementById('syncUrl').value = (store.kdrive && store.kdrive.url) || '';
            document.getElementById('syncToken').value = (store.kdrive && store.kdrive.token) || '';
        }

        function saveSyncConfig(e) {
            e.preventDefault();
            store.kdrive = {
                url: document.getElementById('syncUrl').value.trim().replace(/\/+$/, ''),
                token: document.getElementById('syncToken').value.trim()
            };
            saveLocalStore();
            fillKDriveConfigForm();
            syncWithKDrive();
        }

        class HttpError extends Error {
            constructor(status) { super('HTTP ' + status); this.status = status; }
        }

        function describeError(err) {
            if (err instanceof HttpError) {
                switch (err.status) {
                    case 401: return 'Clé secrète refusée (401). Vérifiez qu\'elle est identique dans le Worker (TOKEN) et dans l\'appli.';
                    case 403: return 'Origine refusée (403). L\'adresse de l\'appli doit correspondre à ALLOWED_ORIGIN dans le Worker.';
                    case 404: return 'Adresse introuvable (404). Vérifiez l\'adresse du Worker.';
                    case 413: return 'Fichier trop volumineux (413).';
                    case 500: return 'Worker mal configuré (500). Vérifiez le binding KV « DATA » et le secret « TOKEN ».';
                    default: return 'Le serveur a répondu avec l\'erreur ' + err.status + '.';
                }
            }
            if (err instanceof TypeError) {
                return 'Serveur injoignable ou requête bloquée. Vérifiez l\'adresse du Worker et votre connexion.';
            }
            return err.message || 'Erreur inconnue.';
        }

        // Fusionne les données distantes dans les données locales
        function mergeRemote(remote) {
            const deleted = new Set([...(store.deletedIds || []), ...(remote.deletedIds || [])]);
            const mergeById = (local, distant) => {
                const map = new Map();
                (distant || []).forEach(x => map.set(x.id, x));
                (local || []).forEach(x => map.set(x.id, x)); // la version locale l'emporte
                return [...map.values()].filter(x => !deleted.has(x.id));
            };
            store.deletedIds = [...deleted];
            store.properties = mergeById(store.properties, remote.properties);
            store.interventions = mergeById(store.interventions, remote.interventions)
                .sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.id.localeCompare(a.id));
        }

        let syncing = false;
        function setSyncing(on) {
            syncing = on;
            const btn = document.getElementById('syncBtn');
            btn.disabled = on;
            btn.classList.toggle('opacity-60', on);
            btn.querySelector('i').classList.toggle('fa-spin', on);
        }

        // silent = true : n'affiche un message qu'en cas d'erreur
        async function syncWithKDrive(silent = false) {
            const config = store.kdrive;
            if (!config || !config.url || !config.token) {
                if (silent !== true) showAlert('Veuillez configurer la synchronisation dans l\'onglet Config.', 'bg-yellow-100 text-yellow-800');
                return;
            }
            if (syncing) return;
            setSyncing(true);
            if (silent !== true) showAlert('Synchronisation en cours...', 'bg-blue-100 text-blue-800');

            const base = config.url.replace(/\/+$/, '');
            const auth = { 'Authorization': 'Bearer ' + config.token };
            let sent = 0, received = 0, missing = 0;

            try {
                // 1. Lire les données distantes (404 = pas encore de données, c'est normal)
                const getRes = await fetch(base + '/data', { method: 'GET', headers: auth });
                if (getRes.ok) {
                    let remote;
                    try { remote = await getRes.json(); }
                    catch { throw new Error('Les données distantes sont illisibles.'); }
                    mergeRemote(remote);
                    saveLocalStore();
                } else if (getRes.status !== 404) {
                    throw new HttpError(getRes.status);
                }

                const attachments = store.interventions.flatMap(i => i.attachments || []);

                // 2. Envoyer les photos locales pas encore envoyées (avant le JSON,
                //    pour qu'un autre appareil ne voie jamais une référence sans fichier)
                for (const att of attachments) {
                    const rec = await photoGet(att.id);
                    if (!rec || rec.synced) continue;
                    const res = await fetch(base + '/photo/' + encodeURIComponent(att.id), {
                        method: 'PUT',
                        headers: { ...auth, 'Content-Type': rec.type || 'application/octet-stream' },
                        body: rec.blob
                    });
                    if (!res.ok) throw new HttpError(res.status);
                    rec.synced = true;
                    await photoPut(rec);
                    sent++;
                }

                // 3. Envoyer le JSON (léger : sans photos ni configuration)
                const putRes = await fetch(base + '/data', {
                    method: 'PUT',
                    headers: { ...auth, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        version: 3,
                        updatedAt: new Date().toISOString(),
                        properties: store.properties,
                        interventions: store.interventions,
                        deletedIds: store.deletedIds
                    })
                });
                if (!putRes.ok) throw new HttpError(putRes.status);

                // 4. Supprimer du cloud les photos des interventions supprimées
                const stillPending = [];
                for (const id of store.pendingPhotoDeletes || []) {
                    try {
                        const res = await fetch(base + '/photo/' + encodeURIComponent(id), { method: 'DELETE', headers: auth });
                        if (!res.ok) stillPending.push(id);
                    } catch { stillPending.push(id); }
                }
                store.pendingPhotoDeletes = stillPending;
                saveLocalStore();

                // 5. Télécharger les photos qui viennent d'autres appareils
                for (const att of attachments) {
                    if (await photoGet(att.id)) continue;
                    const res = await fetch(base + '/photo/' + encodeURIComponent(att.id), { method: 'GET', headers: auth });
                    if (res.status === 404) { missing++; continue; }
                    if (!res.ok) throw new HttpError(res.status);
                    const blob = await res.blob();
                    await photoPut({ id: att.id, name: att.name, type: att.type || blob.type, blob, synced: true });
                    received++;
                }

                renderHistory();
                renderStats();
                renderProperties();
                updatePropertyList();
                document.getElementById('lastSync').textContent = 'Dernière synchro réussie : ' + new Date().toLocaleString('fr-FR');
                if (silent !== true) {
                    const details = [];
                    if (sent) details.push(sent + ' photo(s) envoyée(s)');
                    if (received) details.push(received + ' reçue(s)');
                    if (missing) details.push(missing + ' introuvable(s) sur le cloud');
                    showAlert('Synchronisation réussie !' + (details.length ? ' (' + details.join(', ') + ')' : ''), 'bg-green-100 text-green-800');
                }
            } catch (err) {
                console.error(err);
                showAlert('Erreur de synchro : ' + esc(describeError(err)), 'bg-red-100 text-red-800');
            } finally {
                setSyncing(false);
            }
        }

        function showAlert(msg, bgClass) {
            const el = document.getElementById('statusAlert');
            el.className = `mb-4 p-3 rounded text-sm flex items-center justify-between ${bgClass}`;
            el.innerHTML = `<span>${msg}</span><button onclick="this.parentElement.classList.add('hidden')">&times;</button>`;
            el.classList.remove('hidden');
        }
    </script>
</body>
</html>
